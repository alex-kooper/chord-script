[package]
name = "chord-script"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "chords"
path = "src/main.rs"

[dependencies]
chumsky = "0.13"
thiserror = "2.0.18"
svg = "0.18"
nutype = "0.7"
derive_more = { version = "2.1.1", features = ["full"] }
ariadne = "0.6.0"
anyhow = "1.0.102"
krilla = { version = "0.8", default-features = false }
krilla-svg = "0.8"
usvg = "0.47"
ttf-parser = "0.25"
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
tempfile = "3.27.0"
